services:
  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer

    # Portainer is accessed through Caddy rather than a directly published
    # host management port.
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock

    restart: unless-stopped

    networks:
      - default
      - proxy

volumes:
  portainer_data:
    # Reuse the existing persistent Portainer configuration volume.
    external: true

networks:
  proxy:
    external: true
